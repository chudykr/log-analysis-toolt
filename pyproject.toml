[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyzer"
description = "Command-line tool that finds security incidents in web server and auth logs."
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
loganalyzer = "loganalyzer.cli:main"

[tool.setuptools]
packages = ["loganalyzer"]

[tool.setuptools.package-data]
loganalyzer = ["rules.toml"]

[tool.setuptools.dynamic]
version = { attr = "loganalyzer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (deselect with -m \"not slow\")"]

[tool.coverage.run]
source = ["loganalyzer"]
